# Datacenter: 70B model with tensor parallelism across 4x H100 NVLink
# + a standalone 4090 running a small model

cpu:
  type: EPYC-9654
  tee: sev-snp

clusters:
  - name: "70b-tp-cluster"
    gpu_type: H100-SXM
    count: 4
    strategy: tensor_parallel    # TP: each GPU computes weight shard, NVLink all-reduce
    model: Llama-3-70B

  - name: "small-llm"
    gpu_type: RTX-4090
    count: 1
    strategy: standalone
    model: Qwen2.5-0.5B

network:
  type: 100GbE

verify:
  use_slalom: true
  freivalds_k: 10
  verify_every_n: 1
  compression: fp16

inference:
  batch_size: 1
  seq_len: 64
  gen_tokens: 100
