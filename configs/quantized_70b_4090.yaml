# Llama-3-70B quantized to 4-bit GPTQ on 2x RTX 4090 (fits in 48GB!)
# Without quantization this model needs 140GB VRAM — impossible on 4090s.

cpu:
  type: Xeon-8480+
  tee: tdx

clusters:
  - name: "70b-gptq4"
    gpu_type: RTX-4090
    count: 2
    strategy: pipeline_parallel
    model: Llama-3-70B
    quantization: gptq-4bit        # 140GB -> ~39GB, fits in 2x 4090

  - name: "9b-awq4"
    gpu_type: RTX-4090
    count: 1
    strategy: standalone
    model: Qwen3.5-9B
    quantization: awq-4bit          # 18GB -> ~5GB, plenty of room

  - name: "1b-baseline"
    gpu_type: RTX-4090
    count: 1
    strategy: standalone
    model: Llama-3.2-1B
    quantization: none              # small enough to run at bf16

network:
  type: 10GbE

verify:
  use_slalom: true
  freivalds_k: 10
  verify_every_n: 1
  compression: fp16

inference:
  batch_size: 1
  seq_len: 32
  gen_tokens: 50
