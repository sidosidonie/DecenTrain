# Data parallel: 4x RTX 4090 each running the same model independently
# Multiplies throughput 4x (each GPU serves different requests)

cpu:
  type: Xeon-8480+
  tee: tdx

clusters:
  - name: "llm-serving-dp"
    gpu_type: RTX-4090
    count: 4
    strategy: data_parallel      # DP: each GPU runs full model on different batch
    model: Llama-3.2-1B

network:
  type: 25GbE

verify:
  use_slalom: true
  freivalds_k: 10
  verify_every_n: 1
  compression: fp16

inference:
  batch_size: 1
  seq_len: 32
  gen_tokens: 50
